name: build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

# Only the release step needs write access, and only on a tag. Everything
# else runs with the default read-only token.
permissions:
  contents: write

jobs:
  build:
    runs-on: windows-2022

    steps:
      - uses: actions/checkout@v4

      - name: Configure
        run: cmake -B build -A x64 -DCMAKE_BUILD_TYPE=Release

      # /fileLogger writes msbuild.log next to the project. While this is a
      # shakedown build, a failing run is something to hand to someone else,
      # and copying it out of the web view by hand loses the detail.
      #
      # The single quotes are load-bearing: this step runs under PowerShell,
      # where a bare semicolon separates statements, so an unquoted
      # /fileLoggerParameters:...;Verbosity=normal is parsed as two commands
      # and PowerShell tries to run "Verbosity=normal" as a program.
      - name: Build
        run: cmake --build build --config Release -- /fileLogger '/fileLoggerParameters:LogFile=build\msbuild.log;Verbosity=normal'

      - name: Upload the build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build/msbuild.log
          if-no-files-found: ignore

      # The normaliser is the one piece whose regressions are silent: wrong
      # output still looks like plausible text.
      - name: Test
        run: ctest --test-dir build -C Release --output-on-failure

      # An unsigned binary cannot prove where it came from, so a checksum is
      # published beside it. It is not a signature and does not pretend to be
      # one — it only lets someone confirm the file they downloaded is the
      # file this run produced.
      - name: Checksum
        run: |
          $exe = "build/Release/SnipTextProUltra.exe"
          $hash = (Get-FileHash $exe -Algorithm SHA256).Hash.ToLower()
          "$hash  SnipTextProUltra.exe" | Out-File -Encoding ascii "$exe.sha256"
          Write-Host "SHA256: $hash"

      - name: Upload the build
        uses: actions/upload-artifact@v4
        with:
          name: SnipTextProUltra
          path: |
            build/Release/SnipTextProUltra.exe
            build/Release/SnipTextProUltra.exe.sha256
          if-no-files-found: error

      # --- release, tags only ------------------------------------------------

      # Per-version notes when they exist, the changelog otherwise, so a tag
      # pushed before its notes were written still gets a useful release body
      # rather than an empty one.
      - name: Choose the release notes
        if: startsWith(github.ref, 'refs/tags/v')
        id: notes
        run: |
          $path = "docs/RELEASE-NOTES-${{ github.ref_name }}.md"
          if (-not (Test-Path $path)) {
            Write-Host "No $path — falling back to CHANGELOG.md"
            $path = "CHANGELOG.md"
          }
          "path=$path" | Out-File -FilePath $env:GITHUB_OUTPUT -Append

      - name: Publish the release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ github.ref_name }}
          body_path: ${{ steps.notes.outputs.path }}
          files: |
            build/Release/SnipTextProUltra.exe
            build/Release/SnipTextProUltra.exe.sha256
          fail_on_unmatched_files: true
