name: build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

# Only the release step needs write access, and only on a tag. Everything
# else runs with the default read-only token.
permissions:
  contents: write

jobs:
  build:
    runs-on: windows-2022

    steps:
      - uses: actions/checkout@v4

      # Catches the mistake that is otherwise invisible until someone runs the
      # binary: tagging a commit whose VERSION was never bumped. The tag then
      # builds an executable that reports the previous version, and the
      # release notes for the new one are missing because they were never
      # committed either. Failing here is loud; shipping it is not.
      - name: Check the tag matches VERSION
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          $tag = "${{ github.ref_name }}" -replace '^v', ''
          $file = (Get-Content VERSION -Raw).Trim()
          Write-Host "tag=$tag  VERSION=$file"
          if ($tag -ne $file) {
            Write-Error "Tag v$tag does not match VERSION ($file). The version bump was probably never committed."
            exit 1
          }
          $notes = "docs/RELEASE-NOTES-${{ github.ref_name }}.md"
          if (-not (Test-Path $notes)) {
            Write-Error "$notes is missing from this commit, so the release would fall back to the whole changelog."
            exit 1
          }

      # --- the fast path, on every push --------------------------------------
      #
      # The dependency-free configuration: nothing but the Windows SDK, which
      # is what build.bat produces and what almost every commit touches. It
      # takes a couple of minutes, so ordinary work gets ordinary feedback.
      #
      # This used to run AFTER the Tesseract build, which meant every commit —
      # a menu label, a comment — waited on a twenty-minute vcpkg build before
      # anything was checked at all. It runs first and always now, and the
      # expensive path below is gated on tags.
      - name: Build (dependency-free)
        run: |
          cmake -B build -A x64
          cmake --build build --config Release

      # The normaliser is the one piece whose regressions are silent: wrong
      # output still looks like plausible text. It does not depend on
      # Tesseract, so it runs on the fast path where it is useful.
      - name: Test
        run: ctest --test-dir build -C Release --output-on-failure

      # --- the slow path, tags only ------------------------------------------
      #
      # Tesseract and Leptonica, static, and the trained model. This is what
      # ships, so it has to pass before a release exists — but it has no
      # business running on a commit that nobody is going to download.
      #
      # If you need it on a branch, run the workflow by hand: workflow_dispatch
      # sets RUN_FULL below.
      - name: Cache vcpkg
        if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
        uses: actions/cache@v4
        with:
          path: |
            build-full/vcpkg_installed
            ~/AppData/Local/vcpkg/archives
          key: vcpkg-x64-static-${{ hashFiles('vcpkg.json') }}
          restore-keys: vcpkg-x64-static-

      # The trained model the executable embeds. Fetched rather than
      # committed: 4 MB of binary that never changes does not belong in the
      # history. The shipped exe still carries it internally and still never
      # touches the network.
      - name: Fetch the trained model
        if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
        run: pwsh scripts/fetch-tessdata.ps1 -RequirePinned

      - name: Configure (with Tesseract)
        if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
        run: >
          cmake -B build-full -A x64 -DCMAKE_BUILD_TYPE=Release
          -DSNIPTEXT_WITH_TESSERACT=ON
          -DSNIPTEXT_RELEASE=${{ startsWith(github.ref, 'refs/tags/v') && 'ON' || 'OFF' }}
          -DVCPKG_TARGET_TRIPLET=x64-windows-static
          -DCMAKE_TOOLCHAIN_FILE=C:/vcpkg/scripts/buildsystems/vcpkg.cmake

      # /fileLogger writes msbuild.log next to the project. While this is a
      # shakedown build, a failing run is something to hand to someone else,
      # and copying it out of the web view by hand loses the detail.
      #
      # The single quotes are load-bearing: this step runs under PowerShell,
      # where a bare semicolon separates statements, so an unquoted
      # /fileLoggerParameters:...;Verbosity=normal is parsed as two commands
      # and PowerShell tries to run "Verbosity=normal" as a program.
      - name: Build (with Tesseract)
        if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
        run: cmake --build build-full --config Release -- /fileLogger '/fileLoggerParameters:LogFile=build-full\msbuild.log;Verbosity=normal'

      - name: Upload the build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build-full/msbuild.log
          if-no-files-found: ignore

      # --- whichever binary this run produced --------------------------------
      #
      # A tag ships the Tesseract build; anything else ships the fast one. One
      # step decides which, so nothing below has to repeat the condition — and
      # more to the point, a release can never quietly attach the
      # dependency-free binary because a path was wrong.
      - name: Locate the binary
        id: exe
        run: |
          $full = "build-full/Release/SnipTextProUltra.exe"
          $fast = "build/Release/SnipTextProUltra.exe"
          $isTag = "${{ github.ref }}".StartsWith("refs/tags/v")
          if ($isTag) {
            if (-not (Test-Path $full)) {
              Write-Error "This is a tag, so the release must be the Tesseract build, and $full is not there."
              exit 1
            }
            $exe = $full
          } elseif (Test-Path $full) {
            $exe = $full
          } else {
            $exe = $fast
          }
          Write-Host "Shipping $exe"
          "path=$exe" | Out-File -FilePath $env:GITHUB_OUTPUT -Append

      # An unsigned binary cannot prove where it came from, so a checksum is
      # published beside it. It is not a signature and does not pretend to be
      # one — it only lets someone confirm the file they downloaded is the
      # file this run produced.
      - name: Checksum
        run: |
          $exe = "${{ steps.exe.outputs.path }}"
          $hash = (Get-FileHash $exe -Algorithm SHA256).Hash.ToLower()
          "$hash  SnipTextProUltra.exe" | Out-File -Encoding ascii "$exe.sha256"
          Write-Host "SHA256: $hash"

      - name: Upload the build
        uses: actions/upload-artifact@v4
        with:
          name: SnipTextProUltra
          path: |
            ${{ steps.exe.outputs.path }}
            ${{ steps.exe.outputs.path }}.sha256
          if-no-files-found: error

      # --- release, tags only ------------------------------------------------

      # The guard above already refused the build if this file is missing, so
      # by here it exists. This step stays as a belt-and-braces fallback, and
      # if it ever does fall back it takes only THIS version's section out of
      # the changelog rather than dumping the whole file into the release.
      - name: Choose the release notes
        if: startsWith(github.ref, 'refs/tags/v')
        id: notes
        run: |
          $path = "docs/RELEASE-NOTES-${{ github.ref_name }}.md"
          if (-not (Test-Path $path)) {
            $version = "${{ github.ref_name }}" -replace '^v', ''
            Write-Host "No $path — extracting the $version section from CHANGELOG.md"
            $lines = Get-Content CHANGELOG.md
            $out = @()
            $inSection = $false
            foreach ($line in $lines) {
              if ($line -match '^## \[') {
                if ($inSection) { break }
                if ($line -match [regex]::Escape("[$version]")) { $inSection = $true }
              }
              if ($inSection) { $out += $line }
            }
            if ($out.Count -eq 0) { $out = @("See CHANGELOG.md.") }
            $path = "build-release-notes.md"
            $out | Out-File -Encoding utf8 $path
          }
          "path=$path" | Out-File -FilePath $env:GITHUB_OUTPUT -Append

      - name: Publish the release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ github.ref_name }}
          body_path: ${{ steps.notes.outputs.path }}
          files: |
            ${{ steps.exe.outputs.path }}
            ${{ steps.exe.outputs.path }}.sha256
          fail_on_unmatched_files: true
