  <circle cx="109" cy="278" r="7" fill="#ffffff" stroke="#0067c0" stroke-width="2"/>

    <rect x="192" y="264" width="34" height="28" rx="3" fill="#cce4f6" stroke="#0067c0" stroke-width="2"/>
