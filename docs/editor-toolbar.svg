<text x="45" y="440" font-size="11.5" fill="#55606d">The small blue numbers are the editor-only shortcut keys, not part of the interface. Rectangle is shown selected: it is the default</text>
<text x="45" y="459" font-size="11.5" fill="#55606d">tool, the leftmost button and the 1 key. Add a Screenshot (9) sits with the tools because it ADDS to the picture. Everything to the</text>
<text x="45" y="478" font-size="11.5" fill="#55606d">right of it is one tight run: history, output and the window toggle are all simply not marks, which is the only distinction that matters.</text>

<!-- ══════════ dimensions ══════════ -->
<g transform="translate(45,510)">
  <text x="0" y="0" font-size="13" font-weight="700" fill="#14181d">ONE ROW, LAID OUT LEFT TO RIGHT — WHICH IS WHY NOTHING CAN COLLIDE</text>

  <text x="0" y="26" font-size="11.5" fill="#55606d">The old top bar anchored three groups to three different edges, so widening the window could not push them together. That</text>
  <text x="0" y="45" font-size="11.5" fill="#55606d">mattered because Pin was CENTRED: centring is symmetrical, so the wider flank had to be reserved on both sides, and the window</text>
  <text x="0" y="64" font-size="11.5" fill="#55606d">minimum was set by where the centre would meet a flank. Nothing is centred now, so the row is simply a fixed width:</text>

  <text x="0" y="94" font-family="Consolas, Menlo, monospace" font-size="11.5" fill="#0f172a">10 + 44 + 6 + 120 + 12  +  9×34 + 8×4  +  14 + 5×34 + 4×4  +  10  =  740</text>

  <text x="0" y="124" font-size="11.5" fill="#55606d">That is the whole floor. 740 is wider than the 502 two rows needed — fourteen buttons on one line cost width — but the window is</text>
  <text x="0" y="143" font-size="11.5" fill="#55606d">also 44px SHORTER, because the bar that is gone gave its height back to the canvas. Minimum client area: 740 × 424, was 502 × 468.</text>

  <text x="0" y="173" font-size="11.5" font-weight="700" fill="#14181d">Fourteen buttons, one size, one face. 700 with seven text tools · 540 with nine icon tools · 502 with two rows · 740 with one.</text>
</g>

<!-- ══════════ glyph sheet ══════════ -->
<text x="45" y="720" font-size="13" font-weight="700" fill="#14181d">THE NINE MARK-MAKING GLYPHS, ENLARGED, IN BAR ORDER — DRAWN IN GDI, NO IMAGE RESOURCE ANYWHERE</text>

