<rect width="980" height="940" fill="#ffffff"/>

<text x="45" y="34" font-size="19" font-weight="700" fill="#14181d">SnipTextProUltra 1.10.1 — the editor toolbar</text>
<text x="45" y="54" font-size="11.5" fill="#55606d">One row, three groups. Drawn at 1:1 against the 740px minimum window width; every number is the actual pixel value at 100% DPI.</text>

<!-- ══════════ the window ══════════ -->
