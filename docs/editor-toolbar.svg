<text x="45" y="878" font-size="11.5" fill="#55606d">Add a Screenshot is corner brackets with a plus in them, sharing the marquee of the region overlay and of Lift — Lift takes a piece OUT of this</text>
<text x="45" y="897" font-size="11.5" fill="#55606d">picture, Add brings one IN from the screen. Deliberately not a camera: a camera would say "take a screenshot", and the half that matters is that</text>
<text x="45" y="916" font-size="11.5" fill="#55606d">the result lands here as another movable piece. Crop is two overlapping corner brackets.</text>
</svg>
