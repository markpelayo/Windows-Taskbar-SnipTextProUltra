<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 980" width="900" height="980" font-family="Segoe UI, Inter, Helvetica, Arial, sans-serif">

<defs>
  <g id="g-rect"><rect x="3" y="5.5" width="14" height="10" fill="none" stroke="#23292f" stroke-width="1.7"/></g>
  <g id="g-ellipse"><ellipse cx="10" cy="10.5" rx="7.2" ry="5.2" fill="none" stroke="#23292f" stroke-width="1.7"/></g>
  <g id="g-arrow">
    <path d="M3.5 16.5 L15 5.5" fill="none" stroke="#23292f" stroke-width="1.7" stroke-linecap="round"/>
    <path d="M16.5 4 L9.4 5.6 L14.9 11.2 z" fill="#23292f" stroke="none"/>
  </g>
  <g id="g-line"><path d="M3.5 16.5 L16.5 4.5" fill="none" stroke="#23292f" stroke-width="1.7" stroke-linecap="round"/></g>
  <g id="g-pen"><path d="M3 15.5 C6.5 6, 11.5 17.5, 17 6.5" fill="none" stroke="#23292f" stroke-width="1.7" stroke-linecap="round"/></g>
  <g id="g-text"><path d="M4.2 16.5 L10 4.5 L15.8 16.5 M6.9 12 H13.1" fill="none" stroke="#23292f" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></g>
  <g id="g-lift">
    <rect x="4" y="6" width="12" height="8.5" fill="none" stroke="#23292f" stroke-width="1" stroke-dasharray="2 2"/>
    <rect x="2.2" y="4.2" width="2.8" height="2.8" fill="#23292f"/>
    <rect x="15" y="4.2" width="2.8" height="2.8" fill="#23292f"/>
    <rect x="2.2" y="13.4" width="2.8" height="2.8" fill="#23292f"/>
    <rect x="15" y="13.4" width="2.8" height="2.8" fill="#23292f"/>
  </g>
  <g id="g-crop">
    <path d="M6 2.5 V14 H17.5" fill="none" stroke="#23292f" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M2.5 6 H14 V17.5" fill="none" stroke="#23292f" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <g id="c-undo">
    <path d="M11 8 A4.5 4.5 0 1 1 7.1 14.75" fill="none" stroke="#23292f" stroke-width="1.7" stroke-linecap="round"/>
    <path d="M11 8 H3.5 M3.5 8 L7.3 4.2 M3.5 8 L7.3 11.8" fill="none" stroke="#23292f" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
  <g id="c-redo" transform="translate(20,0) scale(-1,1)">
    <path d="M11 8 A4.5 4.5 0 1 1 7.1 14.75" fill="none" stroke="#23292f" stroke-width="1.7" stroke-linecap="round"/>
    <path d="M11 8 H3.5 M3.5 8 L7.3 4.2 M3.5 8 L7.3 11.8" fill="none" stroke="#23292f" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
  <g id="c-copy">
    <polyline points="6.5,6.5 6.5,3 17,3 17,13.5 13.5,13.5" fill="none" stroke="#23292f" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/>
    <rect x="3" y="6.5" width="10.5" height="10.5" fill="none" stroke="#23292f" stroke-width="1.7" stroke-linejoin="round"/>
  </g>
  <g id="c-save">
    <rect x="3" y="3.5" width="14" height="13" fill="none" stroke="#23292f" stroke-width="1.7" stroke-linejoin="round"/>
    <rect x="7" y="3.5" width="6" height="4.5" fill="#23292f"/>
    <rect x="6" y="10.5" width="8" height="6" fill="none" stroke="#23292f" stroke-width="1.7" stroke-linejoin="round"/>
  </g>
  <g id="c-pin">
    <circle cx="10" cy="6.4" r="3.4" fill="#6e757c"/>
    <path d="M4.6 11 H15.4 M10 11.5 V17.5" fill="none" stroke="#6e757c" stroke-width="1.7" stroke-linecap="round"/>
  </g>
</defs>

<rect width="900" height="980" fill="#ffffff"/>

<text x="45" y="34" font-size="19" font-weight="700" fill="#14181d">SnipTextProUltra 1.9.7 — the editor toolbar</text>
<text x="45" y="54" font-size="11.5" fill="#55606d">Drawn at 1:1 against the 502px minimum window width. Every number is the actual pixel value at 100% DPI.</text>

<!-- ══════════ the window ══════════ -->
<g transform="translate(45,84)">
  <rect x="0" y="0" width="502" height="300" fill="#ffffff" stroke="#b9bfc6"/>

  <!-- top bar -->
  <rect x="0" y="0" width="502" height="44" fill="#f0f0f0"/>
  <line x1="0" y1="44" x2="502" y2="44" stroke="#dcdfe3"/>

  <rect x="10" y="8" width="34" height="28" rx="3" fill="#fdfdfd" stroke="#c3c7cc"/>
  <use href="#c-undo" transform="translate(17,12) scale(0.7)" opacity="0.42"/>
  <rect x="48" y="8" width="34" height="28" rx="3" fill="#fdfdfd" stroke="#c3c7cc"/>
  <use href="#c-redo" transform="translate(55,12) scale(0.7)" opacity="0.42"/>

  <rect x="234" y="8" width="34" height="28" rx="3" fill="#fdfdfd" stroke="#c3c7cc"/>
  <use href="#c-pin" transform="translate(241,12) scale(0.7)"/>
  <text x="251" y="6" font-size="9" font-weight="700" fill="#0067c0" text-anchor="middle">9</text>

  <rect x="420" y="8" width="34" height="28" rx="3" fill="#fdfdfd" stroke="#c3c7cc"/>
  <use href="#c-copy" transform="translate(427,12) scale(0.7)"/>
  <rect x="458" y="8" width="34" height="28" rx="3" fill="#fdfdfd" stroke="#c3c7cc"/>
  <use href="#c-save" transform="translate(465,12) scale(0.7)"/>

  <!-- canvas, with the hint bar the way it actually renders -->
  <rect x="0" y="44" width="502" height="212" fill="#e9eef3"/>
  <text x="251" y="140" font-size="11" fill="#6b7480" text-anchor="middle">canvas</text>
  <rect x="222" y="228" width="268" height="20" rx="4" fill="#ffffff" fill-opacity="0.9" stroke="#c9d1d9"/>
  <text x="356" y="242" font-size="9.5" fill="#39424d" text-anchor="middle">Drag for an outline  ·  Shift for a square  ·  Ctrl to fill</text>

  <!-- bottom bar -->
  <rect x="0" y="256" width="502" height="44" fill="#f0f0f0"/>
  <line x1="0" y1="256" x2="502" y2="256" stroke="#dcdfe3"/>

  <rect x="10" y="264" width="44" height="28" rx="3" fill="#007aff" stroke="#b0b5ba"/>
  <rect x="60" y="264" width="120" height="28" rx="3" fill="#fdfdfd" stroke="#c3c7cc"/>
  <line x1="69" y1="278" x2="171" y2="278" stroke="#9aa1a8" stroke-width="3" stroke-linecap="round"/>
  <line x1="69" y1="278" x2="109" y2="278" stroke="#0067c0" stroke-width="3" stroke-linecap="round"/>
  <circle cx="109" cy="278" r="7" fill="#ffffff" stroke="#0067c0" stroke-width="2"/>

  <g>
    <rect x="192" y="264" width="34" height="28" rx="3" fill="#cce4f6" stroke="#0067c0" stroke-width="2"/>
    <use href="#g-rect" transform="translate(199,268)"/>
    <text x="209" y="262" font-size="9" font-weight="700" fill="#0067c0" text-anchor="middle">1</text>

    <rect x="230" y="264" width="34" height="28" rx="3" fill="#fdfdfd" stroke="#c3c7cc"/>
    <use href="#g-ellipse" transform="translate(237,268)"/>
    <text x="247" y="262" font-size="9" font-weight="700" fill="#0067c0" text-anchor="middle">2</text>

    <rect x="268" y="264" width="34" height="28" rx="3" fill="#fdfdfd" stroke="#c3c7cc"/>
    <use href="#g-arrow" transform="translate(275,268)"/>
    <text x="285" y="262" font-size="9" font-weight="700" fill="#0067c0" text-anchor="middle">3</text>

    <rect x="306" y="264" width="34" height="28" rx="3" fill="#fdfdfd" stroke="#c3c7cc"/>
    <use href="#g-line" transform="translate(313,268)"/>
    <text x="323" y="262" font-size="9" font-weight="700" fill="#0067c0" text-anchor="middle">4</text>

    <rect x="344" y="264" width="34" height="28" rx="3" fill="#fdfdfd" stroke="#c3c7cc"/>
    <use href="#g-pen" transform="translate(351,268)"/>
    <text x="361" y="262" font-size="9" font-weight="700" fill="#0067c0" text-anchor="middle">5</text>

    <rect x="382" y="264" width="34" height="28" rx="3" fill="#fdfdfd" stroke="#c3c7cc"/>
    <use href="#g-text" transform="translate(389,268)"/>
    <text x="399" y="262" font-size="9" font-weight="700" fill="#0067c0" text-anchor="middle">6</text>

    <rect x="420" y="264" width="34" height="28" rx="3" fill="#fdfdfd" stroke="#c3c7cc"/>
    <use href="#g-lift" transform="translate(427,268)"/>
    <text x="437" y="262" font-size="9" font-weight="700" fill="#0067c0" text-anchor="middle">7</text>

    <rect x="458" y="264" width="34" height="28" rx="3" fill="#fdfdfd" stroke="#c3c7cc"/>
    <use href="#g-crop" transform="translate(465,268)"/>
    <text x="475" y="262" font-size="9" font-weight="700" fill="#0067c0" text-anchor="middle">8</text>
  </g>
</g>

<text x="45" y="404" font-size="11.5" fill="#55606d">The small blue numbers are the editor-only shortcut keys, not part of the interface. Rectangle is shown selected: it is the</text>
<text x="45" y="423" font-size="11.5" fill="#55606d">default tool, the leftmost button and the 1 key — one tool doing all three jobs. The swatch is the #007AFF default.</text>

<!-- ══════════ dimensions ══════════ -->
<g transform="translate(45,464)">
  <text x="0" y="0" font-size="13" font-weight="700" fill="#14181d">THREE GROUPS, THREE ANCHORS — WHICH IS WHY THEY CANNOT COLLIDE</text>

  <g transform="translate(0,24)">
    <rect x="0"   y="0" width="82"  height="26" rx="3" fill="#eef4fa" stroke="#9dc4e4"/>
    <text x="41"  y="17" font-size="10.5" font-weight="700" fill="#0067c0" text-anchor="middle">82</text>
    <rect x="234" y="0" width="34" height="26" rx="3" fill="#eef4fa" stroke="#9dc4e4"/>
    <text x="251" y="17" font-size="10.5" font-weight="700" fill="#0067c0" text-anchor="middle">34</text>
    <rect x="420" y="0" width="82"  height="26" rx="3" fill="#eef4fa" stroke="#9dc4e4"/>
    <text x="461" y="17" font-size="10.5" font-weight="700" fill="#0067c0" text-anchor="middle">82</text>

    <line x1="86" y1="13" x2="230" y2="13" stroke="#0067c0" stroke-dasharray="3 3"/>
    <line x1="272" y1="13" x2="416" y2="13" stroke="#0067c0" stroke-dasharray="3 3"/>
    <text x="158" y="9"  font-size="10" fill="#6b7480" text-anchor="middle">gap</text>
    <text x="344" y="9"  font-size="10" fill="#6b7480" text-anchor="middle">gap</text>
    <text x="41"  y="42" font-size="10" fill="#6b7480" text-anchor="middle">anchored left</text>
    <text x="251" y="42" font-size="10" fill="#6b7480" text-anchor="middle">centred on the window</text>
    <text x="461" y="42" font-size="10" fill="#6b7480" text-anchor="middle">anchored right</text>
  </g>

  <text x="0" y="96" font-size="11.5" fill="#55606d">Each group is positioned from its own edge, so widening the window only ever grows the gaps between them.</text>
  <text x="0" y="115" font-size="11.5" fill="#55606d">The only way they can meet is the window getting too narrow, and that is a number rather than a z-order:</text>
  <text x="0" y="140" font-family="Consolas, Menlo, monospace" font-size="11.5" fill="#0f172a">34  +  (82 flank + 12 gutter) × 2  =  222</text>
  <text x="0" y="164" font-size="11.5" fill="#55606d">The centred control has to clear the WIDER flank on both sides, because centring is symmetrical — but here</text>
  <text x="0" y="183" font-size="11.5" fill="#55606d">both flanks are two icon buttons, so they are equal by construction. 222 is far under the tool row's 502, so</text>
  <text x="0" y="202" font-size="11.5" fill="#55606d">the bottom row sets the floor, for the first time since the editor was written. The window minimum is 502.</text>
  <text x="0" y="227" font-size="11.5" font-weight="700" fill="#14181d">Thirteen buttons, one size, one face. 700 with seven text tools · 678 with a text command group · 540 with nine icon tools · 502 now.</text>
</g>

<!-- ══════════ glyph sheet ══════════ -->
<text x="45" y="740" font-size="13" font-weight="700" fill="#14181d">THE EIGHT TOOL GLYPHS, ENLARGED 3×, IN BAR ORDER — DRAWN IN GDI, NO IMAGE RESOURCE ANYWHERE</text>

<g transform="translate(45,756)">
  <g transform="translate(0,0)">
    <rect x="0" y="0" width="76" height="76" rx="5" fill="#cce4f6" stroke="#0067c0" stroke-width="2"/>
    <use href="#g-rect" transform="translate(8,8) scale(3)"/>
    <text x="38" y="92" font-size="11" font-weight="700" fill="#0067c0" text-anchor="middle">1 · Rectangle</text>
  </g>
  <g transform="translate(86,0)">
    <rect x="0" y="0" width="76" height="76" rx="5" fill="#fdfdfd" stroke="#c3c7cc"/>
    <use href="#g-ellipse" transform="translate(8,8) scale(3)"/>
    <text x="38" y="92" font-size="11" fill="#6b7480" text-anchor="middle">2 · Ellipse</text>
  </g>
  <g transform="translate(172,0)">
    <rect x="0" y="0" width="76" height="76" rx="5" fill="#fdfdfd" stroke="#c3c7cc"/>
    <use href="#g-arrow" transform="translate(8,8) scale(3)"/>
    <text x="38" y="92" font-size="11" fill="#6b7480" text-anchor="middle">3 · Arrow</text>
  </g>
  <g transform="translate(258,0)">
    <rect x="0" y="0" width="76" height="76" rx="5" fill="#fdfdfd" stroke="#c3c7cc"/>
    <use href="#g-line" transform="translate(8,8) scale(3)"/>
    <text x="38" y="92" font-size="11" fill="#6b7480" text-anchor="middle">4 · Line</text>
  </g>
  <g transform="translate(344,0)">
    <rect x="0" y="0" width="76" height="76" rx="5" fill="#fdfdfd" stroke="#c3c7cc"/>
    <use href="#g-pen" transform="translate(8,8) scale(3)"/>
    <text x="38" y="92" font-size="11" fill="#6b7480" text-anchor="middle">5 · Pen</text>
  </g>
  <g transform="translate(430,0)">
    <rect x="0" y="0" width="76" height="76" rx="5" fill="#fdfdfd" stroke="#c3c7cc"/>
    <use href="#g-text" transform="translate(8,8) scale(3)"/>
    <text x="38" y="92" font-size="11" fill="#6b7480" text-anchor="middle">6 · Text</text>
  </g>
  <g transform="translate(516,0)">
    <rect x="0" y="0" width="76" height="76" rx="5" fill="#fdfdfd" stroke="#c3c7cc"/>
    <use href="#g-lift" transform="translate(8,8) scale(3)"/>
    <text x="38" y="92" font-size="11" fill="#6b7480" text-anchor="middle">7 · Lift</text>
  </g>
  <g transform="translate(602,0)">
    <rect x="0" y="0" width="76" height="76" rx="5" fill="#fdfdfd" stroke="#c3c7cc"/>
    <use href="#g-crop" transform="translate(8,8) scale(3)"/>
    <text x="38" y="92" font-size="11" fill="#6b7480" text-anchor="middle">8 · Crop</text>
  </g>
</g>

<text x="45" y="900" font-size="11.5" fill="#55606d">Rectangle and Ellipse lead because they are the two most-used, and they sit next to the slider that sizes them. Line and Arrow</text>
<text x="45" y="919" font-size="11.5" fill="#55606d">differ only by the head, so the head is drawn oversized. Crop is two overlapping corner brackets — it is the one tool that is not a</text>
<text x="45" y="938" font-size="11.5" fill="#55606d">mark: it changes what the editor is looking at and then disarms itself. Callout and Redact are both gone, folded into properties any</text>
<text x="45" y="957" font-size="11.5" fill="#55606d">mark can have. Switched-on buttons — the selected tool, and Pin when enabled — take a filled face, an accent ring and accent ink.</text>
</svg>
