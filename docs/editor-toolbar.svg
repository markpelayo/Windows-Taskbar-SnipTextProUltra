  <text x="370" y="140" font-size="9" fill="#93a0ad" text-anchor="middle">44px taller than 1.9.7 — the top bar is gone</text>
  <rect x="460" y="228" width="268" height="20" rx="4" fill="#ffffff" fill-opacity="0.9" stroke="#c9d1d9"/>
  <text x="594" y="242" font-size="9.5" fill="#39424d" text-anchor="middle">Drag for an outline  ·  Shift for a square  ·  Ctrl to fill</text>

  <rect x="0" y="256" width="740" height="44" fill="#f0f0f0"/>
  <line x1="0" y1="256" x2="740" y2="256" stroke="#dcdfe3"/>

  <rect x="10" y="264" width="44" height="28" rx="3" fill="#007aff" stroke="#b0b5ba"/>
